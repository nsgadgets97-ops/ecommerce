<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f8fff9; /* Halka green background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Pura screen cover karega */
            text-align: center;
            position: relative;
        }
        /* Upar wala Cut (X) button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 35px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #28a745;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            max-width: 85%;
        }
        .home-btn {
            margin-top: 40px;
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Cut Button -->
    <a href="index.html" class="close-btn">&times;</a>

    <!-- Success Message Center Mein -->
    <div class="success-icon">✅</div>
    <h1>Order Confirmed!</h1>
    <p>🎉 Order Successfully Placed!
We have received your order details. Our team will begin processing your order immediately after your payment screenshot is verified. Thank you for shopping with us!</p>

    <!-- Optional Back Button -->
    <a href="index.html" class="home-btn">Back to Home</a>
</body>
</html>
