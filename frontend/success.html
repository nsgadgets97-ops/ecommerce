<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | NS Smart Gadgets</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="success-page">
    <a href="index.html" class="close-btn">&times;</a>

    <div class="success-card">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <h1>Order Confirmed!</h1>
        <p>Order successfully placed! We have received your order details. Our team will begin processing your order immediately after your payment screenshot is verified. Thank you for shopping with NS Smart Gadgets!</p>
        <a href="index.html" class="home-btn">Back to Home</a>
    </div>

    <!-- Celebration Animation Script -->
    <script>
        
    
        document.addEventListener('DOMContentLoaded', () => {
            // Confetti fire karne ka ek alag function bana diya
            const fireConfetti = () => {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#059669', '#10b981', '#34d399', '#ffffff']
                });
            };

            // 1. Page load hote hi pehli baar turant fire karega
            fireConfetti();

            // 2. Uske baad har 10 second (10000 milliseconds) mein loop karta rahega
            setInterval(fireConfetti, 5000);
        });
    </script>
</body>
</html>
