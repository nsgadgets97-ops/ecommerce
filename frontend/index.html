<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NS Smart Gadgets</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>

  <div id="announcement-bar" class="announcement-bar" style="display: none;">
    <div id="announcement-text" class="announcement-text"></div>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="index.html">
          <img src="assets/logo.png" alt="NS Smart Gadgets" class="nav-logo" onerror="this.style.display='none'" />
          <span class="brand-name">NS Smart Gadgets</span>
        </a>
      </div>
      <div class="nav-actions">
        <div class="search-wrap">
          <button type="button" id="searchToggleBtn" class="icon-btn" aria-label="Search products">
            <i class="fas fa-search"></i>
          </button>
          <div class="search-panel" id="searchPanel">
            <input type="search" id="productSearchInput" placeholder="Search products..." autocomplete="off" />
            <button type="button" id="searchClearBtn" class="search-clear" aria-label="Clear search">&times;</button>
          </div>
        </div>
        <button id="navAuthBtn" class="btn-secondary">Login</button>
        <button onclick="window.location.href='track.html'" class="btn-secondary">Track Orders</button>
        <button id="openCartBtn" class="cart-btn-wrap icon-btn" aria-label="Open cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="banner-wrap">
    <section class="banner-section" id="bannerSlider"></section>
  </div>

  <section class="category-section">
    <h2 class="section-title">Shop by Categories</h2>
    <nav class="category-nav">
      <div class="category-container" id="categoryList"></div>
    </nav>
  </section>

  <main class="main-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px;">
      <h2 class="section-title" id="currentCategoryTitle" style="margin: 0; font-size: 1.3rem;">All Products</h2>
      
      <!-- Custom Sort Wrapper -->
      <div style="position: relative; display: inline-block;">
        <select id="frontendSortSelect" style="appearance: none; -webkit-appearance: none; background: #ffffff; border: 1.5px solid #e2e8f0; padding: 8px 32px 8px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; color: #334155; cursor: pointer; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
          <option value="default">Sort: Recommended</option>
          <option value="priceLowHigh">Price: Low to High</option>
          <option value="priceHighLow">Price: High to Low</option>
          <option value="nameAZ">Name: A to Z</option>
          <option value="nameZA">Name: Z to A</option>
        </select>
        <!-- Custom FontAwesome Arrow -->
        <i class="fas fa-chevron-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #64748b; pointer-events: none;"></i>
      </div>
    </div>
    <div class="product-grid" id="productGrid">
    <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
      <div class="skeleton-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-title"></div><div class="skeleton skel-price"></div><div class="skel-btn-group"><div class="skeleton skel-btn"></div><div class="skeleton skel-btn"></div></div></div></div>
    </div>
  </main>

  <a href="#" class="whatsapp-float" target="_blank" id="floatingWaBtn" style="display: none;">
    <img src="assets/logo.png" alt="Logo" class="wa-logo" onerror="this.src='https://placehold.co/30'">
    <span class="wa-text">Need Help</span>
    <i class="fab fa-whatsapp wa-icon-img"></i>
  </a>

  <div class="modal-overlay cart-overlay" id="cartModal" style="display: none;">
    <div class="cart-drawer">
      <button class="close-modal-btn" id="closeCartModal">&times;</button>
      <h3 class="modal-heading">Your Cart</h3>
      <div id="cartItemsList" class="cart-drawer-items"></div>
      <div class="cart-drawer-footer">
        <div class="price-breakdown">
          <div class="price-row" style="display: flex; justify-content: space-between; font-weight: 600;">
            <span>Total Cart Value:</span>
            <span id="cartTotalPrice">₹0</span>
          </div>
        </div>
        <button id="cartCheckoutBtn" class="btn-primary">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="trackingModal" style="display: none;">
    <div class="modal-content">
      <button class="close-modal-btn" id="closeTrackingModal">&times;</button>
      <div id="trackingLoginView">
        <h3 class="modal-heading">Login / Track Orders</h3>
        <form id="customerLoginForm">
          <div class="form-group"><label>Phone Number</label><input type="tel" id="trackPhone" required
              placeholder="10-digit registered number" /></div>
          <div class="form-group"><label>Password</label><input type="password" id="trackPassword" required
              placeholder="Enter your password" /></div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;"><a href="#" id="showForgotPwdBtn"
            style="color: #0369a1; text-decoration: underline;">Forgot Password?</a></p>
      </div>
      <div id="forgotPwdView" style="display: none;">
        <h3 class="modal-heading">Reset Password</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">Enter verification details.</p>
        <form id="forgotPwdForm">
          <div class="form-group"><label>Registered Phone *</label><input type="tel" id="fpPhone" required /></div>
          <div class="form-group"><label>Pincode *</label><input type="text" id="fpPincode" placeholder="e.g. 201002"
              required /></div>
          <div class="form-group"><label>New Password *</label><input type="text" id="fpNewPwd" required /></div>
          <button type="submit" class="btn-primary" style="background: #ef4444;">Reset Password</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;"><a href="#" id="backToLoginBtn"
            style="color: #0369a1; text-decoration: underline;">Back to Login</a></p>
      </div>
      <div id="trackingOrdersView" style="display: none;">
        <h3 class="modal-heading">Order History</h3>
        <div id="customerOrdersList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="accountModal" style="display: none;">
    <div class="modal-content" style="max-width: 350px;">
      <button class="close-modal-btn" id="closeAccountModal">&times;</button>
      <h3 class="modal-heading">My Account</h3>
      <div
        style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
        <p style="margin-bottom: 8px; font-size: 0.9rem;"><strong>Phone:</strong> <span id="accPhone"></span></p>
        <p style="font-size: 0.9rem;"><strong>Name:</strong> <span id="accName"></span></p>
      </div>
      <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">Your details will automatically fill during
        checkout.</p>
      <button id="logoutBtn" class="btn-secondary"
        style="width: 100%; border-color: #ef4444; color: #ef4444;">Logout</button>
    </div>
  </div>
  
  <!-- Premium Light Auto Pop-up Video Modal -->
  <div class="modal-overlay" id="autoVideoModal" style="display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    
    <div class="modal-content" style="width: 92%; max-width: 450px; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); position: relative; pointer-events: auto;">
      
      <!-- Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="autoVideoTitle" style="color: #0f172a; margin: 0; font-size: 1.25rem; font-weight: 800;"></h3>
        <button onclick="closeAutoVideoModal()" style="color: #64748b; background: #f1f5f9; border: none; font-size: 1.3rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">&times;</button>
      </div>
      
      <!-- Video Container -->
      <div id="autoVideoIframeContainer" style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; pointer-events: auto;"></div>
      
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="js/footer.js"></script>
  <script src="js/config.js"></script>
  <script src="js/checkout.js?v=2"></script>
  <script src="js/app.js"></script>
</body>

</html>
